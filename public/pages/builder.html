<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Builder — Kelvin Ikpeni CV Lab</title>
  <meta name="description" content="Edit your resume with live preview. Customize sections, choose templates, and download PDF or DOCX." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="/static/css/main.css" />
  <link rel="stylesheet" href="/static/templates/preview.css" />
  <script type="module" src="/static/js/builder.js"></script>
  <script defer src="/static/js/shared.js"></script>
</head>
<body class="builder-body">
  <main id="main">
    <div class="workspace" data-workspace>
      <div class="toolbar">
        <div class="toolbar__left">
          <label class="toolbar__label">
            <span class="sr-only">Resume title</span>
            <input class="input input--title" data-resume-title placeholder="Resume title" />
          </label>
        </div>
        <div class="toolbar__center">
          <label class="toolbar__label">
            <span class="sr-only">Template</span>
            <select class="input" data-template-select></select>
          </label>
        </div>
        <div class="toolbar__right">
          <button class="icon-btn" type="button" data-action="undo" aria-label="Undo (Ctrl+Z)" title="Undo (Ctrl+Z)" disabled>↺</button>
          <button class="icon-btn" type="button" data-action="redo" aria-label="Redo (Ctrl+Shift+Z)" title="Redo (Ctrl+Shift+Z)" disabled>↻</button>
          <div class="completion" data-completion title="Resume completion" aria-label="Resume completion">
            <span class="completion__ring"></span>
            <span class="completion__value" data-completion-value>0%</span>
          </div>
          <span class="save-status" data-save-status data-kind="idle">Ready</span>
          <div class="menu-wrap">
            <button class="btn btn--ghost" type="button" data-action="resumes" aria-haspopup="true" aria-controls="resume-menu">My resumes ▾</button>
            <div class="resume-menu" id="resume-menu" data-resume-menu hidden>
              <header class="resume-menu__head">Saved resumes</header>
              <ul class="resume-menu__list" data-resume-list></ul>
            </div>
          </div>
          <div class="menu-wrap">
            <button class="btn btn--secondary" type="button" data-action="download" aria-haspopup="true" aria-controls="download-menu">Download ▾</button>
            <div class="download-menu" id="download-menu" data-download-menu hidden>
              <button type="button" class="download-menu__item" data-export="pdf">
                <span class="download-menu__title">PDF</span>
                <span class="download-menu__hint">Prints exactly as you see it.</span>
              </button>
              <button type="button" class="download-menu__item" data-export="docx">
                <span class="download-menu__title">DOCX</span>
                <span class="download-menu__hint">Editable Word document.</span>
              </button>
            </div>
          </div>
          <button class="btn btn--ghost" type="button" data-action="delete" title="Delete saved resume">Delete</button>
          <button class="btn btn--primary" type="button" data-action="save">Save</button>
          <button class="btn btn--secondary" type="button" data-mobile-toggle>Preview</button>
        </div>
      </div>

      <div class="template-warn" data-template-warn hidden></div>

      <div class="panes">
        <aside class="pane pane--editor" aria-label="Editor">
          <nav class="section-nav" data-section-nav></nav>
          <section class="editor-panel" data-editor-panel></section>
        </aside>
        <section class="pane pane--preview" aria-label="Preview">
          <div class="preview-shell">
            <div class="preview-host" data-preview-host></div>
          </div>
        </section>
      </div>

      <div class="toast" data-toast hidden></div>
    </div>
  </main>
</body>
</html>
