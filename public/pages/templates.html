<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Resume templates — Kelvin Ikpeni CV Lab</title>
  <meta name="description" content="12 professionally designed resume templates: modern, minimalist, executive, corporate, creative, ATS, and more. Every preview is a live render." />
  <link rel="canonical" href="/templates" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Kelvin Ikpeni CV Lab" />
  <meta property="og:title" content="Resume templates — Kelvin Ikpeni CV Lab" />
  <meta property="og:description" content="12 professionally designed resume templates. Free, no signup required." />
  <meta property="og:image" content="/static/img/og-home.svg" />
  <meta property="og:url" content="/templates" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="/static/css/main.css" />
  <link rel="stylesheet" href="/static/templates/preview.css" />
  <script type="module" src="/static/js/templates-page.js"></script>
  <script defer src="/static/js/shared.js"></script>
</head>
<body>
  <main id="main">
    <section class="section section--tight">
      <div class="container">
        <div class="section__header">
          <span class="eyebrow">Templates</span>
          <h1 style="font-size:var(--fs-4xl);margin:0 0 var(--space-3);">Pick a starting point.</h1>
          <p>Twelve fully implemented designs. Every preview is a live render of the actual template you'll download.</p>
        </div>

        <div class="gallery-toolbar">
          <label class="search">
            <span class="sr-only">Search templates</span>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="11" cy="11" r="7"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="search" placeholder="Search templates…" data-search autocomplete="off" />
          </label>
          <div class="gallery-count" data-result-count aria-live="polite"></div>
        </div>

        <div class="filter-bar" data-filter-bar role="group" aria-label="Filter by category"></div>

        <div class="template-grid" data-template-grid></div>

        <p class="gallery-empty" data-empty hidden>
          No templates match your search. <button type="button" class="btn btn--ghost" onclick="document.querySelector('[data-search]').value='';document.querySelector('[data-search]').dispatchEvent(new Event('input'))">Clear search</button>
        </p>
      </div>
    </section>

    <section class="section section--tight">
      <div class="container" style="text-align:center;">
        <p style="color:var(--color-muted);">Not sure where to start? The <strong>Modern Professional</strong> and <strong>ATS Plain</strong> templates work well across most industries.</p>
      </div>
    </section>
  </main>

  <div class="modal" data-preview-modal hidden aria-hidden="true">
    <div class="modal__backdrop" tabindex="-1"></div>
    <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="preview-title">
      <header class="modal__head">
        <h2 id="preview-title" class="modal__title" data-preview-title>Preview</h2>
        <button type="button" class="modal__close" data-preview-close aria-label="Close preview">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </header>
      <div class="modal__body" data-preview-body></div>
      <footer class="modal__foot">
        <button type="button" class="btn btn--primary" data-preview-use>Use this template</button>
      </footer>
    </div>
  </div>
</body>
</html>
