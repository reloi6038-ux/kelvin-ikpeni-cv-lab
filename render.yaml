services:
  - type: web
    name: kelvin-ikpeni-cv-lab
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: SESSION_PEPPER
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://kelvin-ikpeni-cv-lab.onrender.com